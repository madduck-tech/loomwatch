suite: prometheus rule
templates:
  - prometheusrule.yaml
tests:
  - it: is not installed unless asked for
    asserts:
      - hasDocuments:
          count: 0

  - it: ships the five default rules
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[0].alert
          value: LoomwatchQuotaHigh
      - equal:
          path: spec.groups[0].rules[1].alert
          value: LoomwatchQuotaCritical
      - equal:
          path: spec.groups[0].rules[2].alert
          value: LoomwatchQuotaBurnsBeforeReset
      - equal:
          path: spec.groups[0].rules[3].alert
          value: LoomwatchCollectorNotPolling
      - equal:
          path: spec.groups[0].rules[4].alert
          value: LoomwatchCollectorStale

  # The exclusion pattern is anchored on both sides by PromQL, so a bare
  # `video` would silently let `weekly_video` into the consumption rules.
  # Regressing this would widen the alert with no visible diff in the rules.
  - it: excludes video quotas in every window, not only the one literally named video
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'quota_type!~"\.\*video"'

  # predict_linear takes a scalar horizon, so it cannot use each series' own
  # reset time; passing the reset vector to it is a parse error and the rule
  # never evaluates while still looking healthy. The prediction must therefore
  # stay written as vector arithmetic.
  - it: predicts with vector arithmetic rather than predict_linear
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - notMatchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: "predict_linear"
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: "sum_over_time\\("

  # deriv() fits a line through the sawtooth a provider draws when it gives
  # quota back mid-window, and rate() reads each fall as a reset to zero and
  # adds the whole level after it. burn_test.yaml proves the consequences
  # against a real engine; this pins the text so a regression is visible in
  # review as well.
  - it: measures the pace as summed rises, not deriv or rate over the level
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - notMatchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: "deriv\\("
      - notMatchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: "(^|[^_])rate\\("
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: "\\[1h:2m\\]"
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: "\\[24h:5m\\]"

  - it: refuses to predict past the horizon gate
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: "< 172800"

  # The collector-liveness threshold is derived from the poll interval so that
  # changing the interval moves the alert with it instead of leaving a stale
  # hand-picked number behind.
  - it: derives the polling threshold from pollInterval
    set:
      metrics.prometheusRule.enabled: true
      pollInterval: 60
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[3].expr
          pattern: "> 300\\)$"

  - it: honours custom thresholds
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.highThreshold: 70
      metrics.prometheusRule.criticalThreshold: 90
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: "> 70\\)$"
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: "> 90\\)$"

  - it: lets individual rules be switched off
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.defaultRules.quotaHigh: false
    asserts:
      - equal:
          path: spec.groups[0].rules[0].alert
          value: LoomwatchQuotaCritical

  # The team join. Its absence is not cosmetic: loomwatch:account_team does not
  # exist when no team is configured, and multiplying by a series that does not
  # exist returns nothing - so an unconditional join would silently stop every
  # rule here from ever firing. These two cases are the guard against that.
  - it: leaves the alert expressions alone when no team is configured
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - notMatchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: group_left
      - notMatchRegex:
          path: spec.groups[0].rules[4].expr
          pattern: group_left

  - it: joins the owning team onto every quota alert once teams are configured
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.teams:
        - provider: zai
          accountId: "1"
          team: platform
    asserts:
      - matchRegex:
          path: spec.groups[1].rules[0].expr
          pattern: '\* on \(provider, account_id\) group_left\(team\) loomwatch:account_team$'
      - matchRegex:
          path: spec.groups[1].rules[1].expr
          pattern: 'group_left\(team\) loomwatch:account_team$'
      - matchRegex:
          path: spec.groups[1].rules[2].expr
          pattern: 'group_left\(team\) loomwatch:account_team$'
      - matchRegex:
          path: spec.groups[1].rules[3].expr
          pattern: 'group_left\(team\) loomwatch:account_team$'
      - matchRegex:
          path: spec.groups[1].rules[4].expr
          pattern: 'group_left\(team\) loomwatch:account_team$'

  # The join key needs account_id, and grouping by provider alone also hides one
  # expired key behind its healthy siblings.
  - it: groups the collector alerts by account, not only by provider
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[3].expr
          pattern: 'max by \(provider, account_id\)'
      - matchRegex:
          path: spec.groups[0].rules[4].expr
          pattern: 'min by \(provider, account_id\)'

  # A group rendered with `rules: null` is accepted by the CRD and loaded by
  # Prometheus without complaint, so nothing downstream reports it. It just sits
  # in the cluster looking like coverage.
  - it: omits the quota group entirely when every rule in it is switched off
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.defaultRules.quotaHigh: false
      metrics.prometheusRule.defaultRules.quotaCritical: false
      metrics.prometheusRule.defaultRules.burnRate: false
      metrics.prometheusRule.defaultRules.collectorNotPolling: false
      metrics.prometheusRule.defaultRules.collectorStale: false
      metrics.prometheusRule.teams:
        - provider: zai
          accountId: "1"
          team: platform
    asserts:
      - lengthEqual:
          path: spec.groups
          count: 1
      - equal:
          path: spec.groups[0].name
          value: loomwatch.teams

  - it: renders nothing at all when there is neither a team nor a rule
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.defaultRules.quotaHigh: false
      metrics.prometheusRule.defaultRules.quotaCritical: false
      metrics.prometheusRule.defaultRules.burnRate: false
      metrics.prometheusRule.defaultRules.collectorNotPolling: false
      metrics.prometheusRule.defaultRules.collectorStale: false
    asserts:
      - hasDocuments:
          count: 0

  # Ownership mapping. The default is off, and off must mean the rendered
  # output is exactly what it was before this feature existed - the quota group
  # stays at index 0 and nothing else appears.
  - it: renders no team group unless teams are configured
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[0].name
          value: loomwatch.quotas
      - lengthEqual:
          path: spec.groups
          count: 1

  - it: publishes the mapping as one rule covering every listed account
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.teams:
        - provider: zai
          accountId: "1"
          team: platform
        - provider: anthropic
          accountId: "default"
          team: research
    asserts:
      - equal:
          path: spec.groups[0].name
          value: loomwatch.teams
      # One rule, not one per entry: separate rules recording the same series
      # name are rejected by promtool's linter as duplicates.
      - equal:
          path: spec.groups[0].rules[0].record
          value: loomwatch:account_team_map
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'team", "platform".*or.*team", "research"'

  # account_id is unique per provider, not globally - several providers report
  # "default". Joining on account_id alone aborts the whole query with a
  # many-to-one error instead of returning partial data, so the join key is
  # pinned by a test rather than left to whoever edits the template next.
  - it: joins on provider and account_id together
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.teams:
        - provider: zai
          accountId: "1"
          team: platform
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: 'unless on \(provider, account_id\)'

  # Without this rule the feature is a regression: an account nobody assigned
  # would simply be absent from every per-team query, and nothing would say so.
  - it: alerts on accounts that have no owning team
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.teams:
        - provider: zai
          accountId: "1"
          team: platform
    asserts:
      - equal:
          path: spec.groups[0].rules[2].alert
          value: LoomwatchAccountWithoutTeam
      - equal:
          path: spec.groups[0].rules[2].expr
          value: 'loomwatch:account_team{team="unassigned"}'

  - it: can drop the unassigned-account rule without dropping the mapping
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.defaultRules.accountWithoutTeam: false
      metrics.prometheusRule.teams:
        - provider: zai
          accountId: "1"
          team: platform
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 2

  # Regression: an unquoted 1000000 is a YAML number, which Helm renders as
  # "1e+06". The mapping then names an account that does not exist while the
  # real one stays unassigned - and the alert fires against an account the
  # operator did assign. Rejecting it at the schema is the only loud failure
  # available, since nothing downstream can tell 1e+06 from a real id.
  - it: refuses an accountId that is not a string
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.teams:
        - provider: minimax
          accountId: 1000000
          team: big
    asserts:
      - failedTemplate: {}

  # Regression: two entries for one pair publish two series for one match group,
  # and every consumer join then fails with many-to-one - including for accounts
  # unrelated to the duplicate. JSON Schema cannot express uniqueness over a
  # subset of fields, so the template is where this has to be caught.
  - it: refuses two entries for the same provider and account
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.teams:
        - provider: zai
          accountId: "1"
          team: platform
        - provider: zai
          accountId: "1"
          team: research
    asserts:
      - failedTemplate:
          errorPattern: "listed twice"

  # Regression: an exclusion class such as [^$"\\] passes newlines and C0
  # control characters, which break rendering, and passes zero-width characters,
  # which produce two teams no dashboard can tell apart.
  - it: refuses a team name containing a newline
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.teams:
        - provider: zai
          accountId: "1"
          team: "plat\nform"
    asserts:
      - failedTemplate: {}

  # Regression: api_integrations reports a provider/account_id pair but is the
  # collector's own ingestion path, not a subscription. Left in the universe it
  # fires LoomwatchAccountWithoutTeam forever against a complete mapping.
  - it: keeps providers that are not accounts out of the ownership universe
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.teams:
        - provider: zai
          accountId: "1"
          team: platform
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: 'loomwatch_agent_healthy\{provider!~"api_integrations"\}'

  # A quota alert is not fixed by restarting anything, which is where most
  # on-call instincts start. Every alert therefore carries a runbook, and
  # scripts/check-runbook-links.py fails the build if the anchor is not a real
  # heading - a link that costs a click and returns nothing is worse than none.
  - it: points every alert at a runbook
    set:
      metrics.prometheusRule.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].annotations.runbook_url
          pattern: '#loomwatchquotahigh$'
      - matchRegex:
          path: spec.groups[0].rules[4].annotations.runbook_url
          pattern: '#loomwatchcollectorstale$'

  - it: lets a downstream fork repoint the runbooks
    set:
      metrics.prometheusRule.enabled: true
      metrics.prometheusRule.runbookUrlBase: https://example.invalid/rb.md
    asserts:
      - equal:
          path: spec.groups[0].rules[0].annotations.runbook_url
          value: https://example.invalid/rb.md#loomwatchquotahigh

  # The collector-liveness rule and the collector's own health flag have to use
  # the same number of poll intervals. They did not: the flag fell after two
  # while this rule fires after five, so the health series went red three
  # intervals before the alert had an opinion and usually recovered before
  # anyone could look. staleIntervals in internal/metrics/metrics.go is the
  # other half of this pair.
  - it: goes stale at the same age the collector's own health flag does
    set:
      metrics.prometheusRule.enabled: true
      pollInterval: 120
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[3].expr
          pattern: '> 600'
