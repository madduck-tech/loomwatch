## loomwatch ingress parameters
##
## The panel carries the whole product surface behind a single password and has
## no second factor. Exposing it is a deliberate act, so this is off by default
## even though the chart makes it a one-liner.
##
ingress:
  ## @param ingress.enabled Enable ingress record generation for loomwatch
  ##
  enabled: false
  ## @param ingress.pathType Ingress path type
  ##
  pathType: ImplementationSpecific
  ## @param ingress.apiVersion Force Ingress API version (automatically detected if not set)
  ##
  apiVersion: ""
  ## @param ingress.hostname Default host for the ingress record
  ##
  hostname: loomwatch.local
  ## @param ingress.ingressClassName IngressClass that will be used to implement the Ingress
  ##
  ingressClassName: ""
  ## @param ingress.path Default path for the ingress record
  ##
  path: /
  ## @param ingress.annotations Additional annotations for the Ingress resource
  ##
  annotations: {}
  ## @param ingress.tls Enable TLS configuration for the host defined at `ingress.hostname` parameter
  ##
  tls: false
  ## @param ingress.selfSigned Create a TLS secret for this ingress record using self-signed certificates generated by Helm
  ##
  selfSigned: false
  ## @param ingress.extraHosts An array with additional hostname(s) to be covered with the ingress record
  ##
  extraHosts: []
  ## @param ingress.extraPaths An array with additional arbitrary paths that may need to be added to the ingress under the main host
  ##
  extraPaths: []
  ## @param ingress.extraTls TLS configuration for additional hostname(s) to be covered with this ingress record
  ##
  extraTls: []
  ## @param ingress.secrets Custom TLS certificates as secrets
  ##
  secrets: []
  ## @param ingress.extraRules Additional rules to be covered with this ingress record
  ##
  extraRules: []

## loomwatch Gateway API route
##
## The alternative to `ingress` above, for clusters that route with Gateway API.
## Same caveat applies and for the same reason: this publishes a panel whose
## only protection is one password with no second factor.
##
## Off by default, and deliberately not auto-detected from installed CRDs.
## Which router publishes a service is a decision, and a chart that silently
## picks one based on what happens to be installed produces a different result
## on two clusters from identical values.
##
httpRoute:
  ## @param httpRoute.enabled Enable Gateway API HTTPRoute record generation
  ##
  enabled: false
  ## @param httpRoute.apiVersion HTTPRoute API version
  ## v1 since Gateway API 1.0; older installations still serve v1beta1 only.
  ##
  apiVersion: gateway.networking.k8s.io/v1
  ## @param httpRoute.parentRefs Gateways this route attaches to. Required when enabled
  ## There is no default: a route with no parent is accepted by the API server
  ## and then routes nothing, which is indistinguishable from a working install
  ## until someone tries the address.
  ## E.g.
  ## parentRefs:
  ##   - name: my-gateway
  ##     namespace: gateway-system
  ##     sectionName: https
  ##
  parentRefs: []
  ## @param httpRoute.hostnames Hostnames this route matches. Empty means every hostname the Gateway serves
  ##
  hostnames: []
  ## @param httpRoute.path Path prefix for the default rule
  ##
  path: /
  ## @param httpRoute.pathType Path match type for the default rule. Allowed values: `PathPrefix`, `Exact`, `RegularExpression`
  ##
  pathType: PathPrefix
  ## @param httpRoute.filters Filters applied to the default rule
  ##
  filters: []
  ## @param httpRoute.weight Backend weight for the default rule
  ##
  weight: ""
  ## @param httpRoute.rules Replace the generated rule entirely with your own
  ##
  rules: []
  ## @param httpRoute.annotations Additional annotations for the HTTPRoute resource
  ##
  annotations: {}
  ## @param httpRoute.labels Additional labels for the HTTPRoute resource
  ##
  labels: {}
  ## @param httpRoute.allowAlongsideIngress Permit an Ingress and an HTTPRoute at the same time
  ## Rendering both is refused by default. Two routes to one Service is nearly
  ## always a migration someone stopped halfway through, and the forgotten one
  ## keeps serving on an address nobody watches any more.
  ##
  allowAlongsideIngress: false

## @section Persistence Parameters
##

## Persistence parameters
##
## Persistence is on by default, and that is not the cautious default it looks
## like. Provider accounts and the panel password live in this database and can
## only be created through the UI, so on an ephemeral volume a second account
## disappears at the first Pod replacement - and you find out when its quota
## burns unwatched. Quota history itself is disposable; Prometheus keeps that.
##
persistence:
  ## @param persistence.enabled Enable persistence using Persistent Volume Claims
  ##
  enabled: true
  ## @param persistence.mountPath Path to mount the volume at
  ##
  mountPath: /data
  ## @param persistence.subPath The subdirectory of the volume to mount to
  ##
  subPath: ""
  ## @param persistence.storageClass Storage class of backing PVC
  ##
  storageClass: ""
  ## @param persistence.annotations Persistent Volume Claim annotations
  ##
  annotations: {}
  ## @param persistence.labels Persistent Volume Claim labels
  ##
  labels: {}
  ## @param persistence.accessModes Persistent Volume Access Modes
  ##
  accessModes:
    - ReadWriteOnce
  ## @param persistence.size Size of data volume
  ##
  size: 1Gi
  ## @param persistence.selector Selector to match an existing Persistent Volume for the data PVC
  ##
  selector: {}
  ## @param persistence.dataSource Custom PVC data source
  ##
  dataSource: {}
  ## @param persistence.existingClaim The name of an existing PVC to use for persistence
  ##
  existingClaim: ""

