## Enable diagnostic mode in the deployment.
## The image is distroless and has no shell, so the override below is a no-op
## unless you also point image.repository at a shell-bearing variant. Upstream
## publishes one as the `alpine` tag.
## @param diagnosticMode.enabled Enable diagnostic mode (all probes will be disabled and the command will be overridden)
## @param diagnosticMode.command Command to override all containers in the deployment
## @param diagnosticMode.args Args to override all containers in the deployment
##
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

## @section loomwatch Image parameters
##

## loomwatch image
## ref: https://github.com/madduck-tech/loomwatch/pkgs/container/loomwatch
## @param image.registry [default: ghcr.io] loomwatch image registry
## @param image.repository loomwatch image repository
## @param image.tag loomwatch image tag; empty means the chart's appVersion, which is the version this chart ships
## @param image.digest loomwatch image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
## @param image.pullPolicy loomwatch image pull policy
## @param image.pullSecrets loomwatch image pull secrets
##
image:
  registry: ghcr.io
  repository: madduck-tech/loomwatch
  ## Left empty on purpose: the chart and the application are released
  ## together and carry the same number, so appVersion is the tag. A literal
  ## here is a second copy of that number, and the copy is what goes stale.
  ##
  tag: ""
  ## Pinning by digest is strongly recommended for a component whose readings
  ## alerts are built on: a moving tag lets the running version change with no
  ## diff in whatever declares it.
  ##
  digest: ""
  pullPolicy: IfNotPresent
  ## E.g.
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  pullSecrets: []

## @section loomwatch configuration parameters
##

## @param containerPort loomwatch HTTP container port
##
containerPort: 9211
## @param logLevel loomwatch log level. Allowed values: `debug`, `info`, `warn`, `error`
##
logLevel: info
## @param pollInterval Seconds between provider quota polls
## The collector-liveness alert rule derives its threshold from this value, so
## changing it moves the alert with it rather than leaving a hand-picked number
## behind.
##
pollInterval: 120
## @param databasePath Path of the SQLite database inside the container
## Must live under persistence.mountPath when persistence is enabled.
##
databasePath: /data/onwatch.db
## @param extraEnvVars Array with extra environment variables to add to the loomwatch container
##
extraEnvVars: []
## @param extraEnvVarsCM Name of existing ConfigMap containing extra env vars
##
extraEnvVarsCM: ""
## @param extraEnvVarsSecret Name of existing Secret containing extra env vars
##
extraEnvVarsSecret: ""

## @section Credentials parameters
##

## loomwatch credentials.
##
## Providers are a free-form map rather than named fields on purpose: upstream
## supports more than ten providers and the set changes between releases, so a
## fixed list would go stale. The key is the environment variable the collector
## reads (`MINIMAX_API_KEY`, `ZAI_API_KEY`, ...).
##
## @param auth.adminPassword Password for the built-in `admin` panel user. Generated randomly if empty and no existing secret is given
## @param auth.metricsToken Bearer token required on /metrics. Generated randomly if empty and no existing secret is given
## @param auth.providers [object] Map of provider credential environment variables to their values
## @param auth.accounts [array] Provider subscriptions declared in configuration rather than created in the dashboard
## @param auth.existingSecret Name of an existing Secret holding all credentials. Takes precedence over the values above
## @param auth.secretKeys.adminPasswordKey Key in the existing Secret holding the admin password
## @param auth.secretKeys.metricsTokenKey Key in the existing Secret holding the metrics token
##
auth:
  adminPassword: ""
  metricsToken: ""
  ## E.g.
  ## providers:
  ##   MINIMAX_API_KEY: "..."
  ##   ZAI_API_KEY: "..."
  ##
  providers: {}
  ## Subscriptions this deployment polls, declared rather than clicked in.
  ##
  ## Until this existed the first account of a provider came from an environment
  ## variable and every further one had to be created by hand in the dashboard,
  ## which made the set of subscriptions a property of one SQLite file: it could
  ## not be reviewed, could not be recreated, and did not survive the volume
  ## being replaced.
  ##
  ## The credential is not written here. apiKeyEnv names the environment
  ## variable holding it, which arrives through providers above or through
  ## existingSecret like every other key - so this list can live in git while
  ## the secret stays wherever the deployment already keeps secrets.
  ##
  ## Only providers that keep credentials per account can appear: zai and
  ## minimax. The rest take one key from the environment and have a single
  ## account by construction.
  ##
  ## Accounts are created and updated, never removed. One that vanishes from
  ## this list keeps polling and is logged as undeclared: deleting a
  ## subscription because a line went missing would take its history with it,
  ## and a typo should not be able to do that.
  ##
  ## accounts:
  ##   - provider: zai
  ##     name: spare-max
  ##     apiKeyEnv: ZAI_SPARE_MAX_API_KEY
  ##   - provider: minimax
  ##     name: minimax-2
  ##     apiKeyEnv: MINIMAX_SECOND_API_KEY
  ##     baseUrl: https://api.minimax.io
  ##
  accounts: []
  existingSecret: ""
  secretKeys:
    adminPasswordKey: ONWATCH_ADMIN_PASS
    metricsTokenKey: ONWATCH_METRICS_TOKEN

## @section loomwatch deployment parameters
##

## @param replicaCount Number of loomwatch replicas to deploy
## Kept at 1 and not exposed to autoscaling: the collector is a single writer
## against a SQLite file on a ReadWriteOnce volume. A second replica would not
## share the volume and would double every provider poll.
##
replicaCount: 1
## @param updateStrategy.type loomwatch deployment strategy type
## `Recreate` is not a default carried over by accident. With a ReadWriteOnce
## volume a RollingUpdate schedules the new Pod before the old one is gone; if
## it lands on another node it deadlocks on Multi-Attach and the rollout never
## completes.
##
updateStrategy:
  type: Recreate
## @param priorityClassName loomwatch pod priority class name
##
priorityClassName: ""
## @param schedulerName Name of the Kubernetes scheduler (other than default)
##
schedulerName: ""
## @param terminationGracePeriodSeconds Seconds loomwatch pod needs to terminate gracefully
##
terminationGracePeriodSeconds: ""
## @param topologySpreadConstraints Topology Spread Constraints for pod assignment
##
topologySpreadConstraints: []
## @param podLabels Extra labels for loomwatch pods
##
podLabels: {}
## @param podAnnotations Annotations for loomwatch pods
##
podAnnotations: {}
## @param podAffinityPreset Pod affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
##
podAffinityPreset: ""
## @param podAntiAffinityPreset Pod anti-affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
##
podAntiAffinityPreset: soft
## Node affinity preset
## @param nodeAffinityPreset.type Node affinity preset type. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## @param nodeAffinityPreset.key Node label key to match. Ignored if `affinity` is set
## @param nodeAffinityPreset.values Node label values to match. Ignored if `affinity` is set
##
nodeAffinityPreset:
  type: ""
  key: ""
  values: []
## @param affinity Affinity for pod assignment
##
affinity: {}
## @param nodeSelector Node labels for pod assignment
##
nodeSelector: {}
## @param tolerations Tolerations for pod assignment
##
tolerations: []
## loomwatch pods' Security Context
## @param podSecurityContext.enabled Enabled loomwatch pods' Security Context
## @param podSecurityContext.fsGroupChangePolicy Set filesystem group change policy
## @param podSecurityContext.supplementalGroups Set filesystem extra groups
## @param podSecurityContext.fsGroup Set loomwatch pod's Security Context fsGroup
##
podSecurityContext:
  enabled: true
  fsGroupChangePolicy: Always
  supplementalGroups: []
  ## The image runs as the distroless `nonroot` user (65532). A freshly
  ## provisioned volume is owned by root, so without fsGroup the process cannot
  ## create its database and the container exits with "database path is not
  ## writable". An emptyDir never showed this because it is world-writable.
  ##
  fsGroup: 65532
## loomwatch containers' Security Context
## @param containerSecurityContext.enabled Enabled loomwatch containers' Security Context
## @param containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in container
## @param containerSecurityContext.runAsUser Set loomwatch containers' Security Context runAsUser
## @param containerSecurityContext.runAsGroup Set loomwatch containers' Security Context runAsGroup
## @param containerSecurityContext.runAsNonRoot Set loomwatch containers' Security Context runAsNonRoot
## @param containerSecurityContext.readOnlyRootFilesystem Set loomwatch containers' Security Context readOnlyRootFilesystem
## @param containerSecurityContext.privileged Set loomwatch containers' Security Context privileged
## @param containerSecurityContext.allowPrivilegeEscalation Set loomwatch containers' Security Context allowPrivilegeEscalation
## @param containerSecurityContext.capabilities.drop List of capabilities to be dropped
## @param containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
##
containerSecurityContext:
  enabled: true
  seLinuxOptions: {}
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  ## The binary writes only to the mounted volume, so the root filesystem can
  ## stay read-only. Nothing in the image needs to write to itself: the unit of
  ## delivery is the image, and self-update was removed rather than shipped
  ## against a filesystem that refuses it.
  ##
  readOnlyRootFilesystem: true
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
## loomwatch containers' resource requests and limits
## @param resourcesPreset Set container resources according to one common preset. Ignored if `resources` is set
## @param resources Set container requests and limits for different resources like CPU or memory
##
resourcesPreset: nano
resources: {}
## Configure extra options for loomwatch containers' liveness and readiness probes
##
## The probes hit `/login`, which is the only route that answers 200 without
## credentials. There is no dedicated health endpoint upstream: `/` answers 302
## to the login page, and `/metrics` answers 401 unless the bearer token is
## presented - and a probe is not a place to put a secret.
## @param livenessProbe.enabled Enable livenessProbe on loomwatch containers
## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
## @param livenessProbe.periodSeconds Period seconds for livenessProbe
## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
## @param livenessProbe.successThreshold Success threshold for livenessProbe
##
livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
## @param readinessProbe.enabled Enable readinessProbe on loomwatch containers
## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
## @param readinessProbe.periodSeconds Period seconds for readinessProbe
## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
## @param readinessProbe.successThreshold Success threshold for readinessProbe
##
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
## @param startupProbe.enabled Enable startupProbe on loomwatch containers
## @param startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
## @param startupProbe.periodSeconds Period seconds for startupProbe
## @param startupProbe.timeoutSeconds Timeout seconds for startupProbe
## @param startupProbe.failureThreshold Failure threshold for startupProbe
## @param startupProbe.successThreshold Success threshold for startupProbe
##
startupProbe:
  enabled: false
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1
## @param customLivenessProbe Custom livenessProbe that overrides the default one
##
customLivenessProbe: {}
## @param customReadinessProbe Custom readinessProbe that overrides the default one
##
customReadinessProbe: {}
## @param customStartupProbe Custom startupProbe that overrides the default one
##
customStartupProbe: {}
## @param lifecycleHooks for the loomwatch container(s) to automate configuration before or after startup
##
lifecycleHooks: {}
## @param command Override default container command (useful when using custom images)
##
command: []
## @param args Override default container args (useful when using custom images)
##
args: []
## @param automountServiceAccountToken Mount Service Account token in loomwatch pods
## The collector talks to provider APIs, never to the Kubernetes API.
##
automountServiceAccountToken: false
## @param hostAliases loomwatch pods host aliases
##
hostAliases: []
## @param extraVolumes Optionally specify extra list of additional volumes for the loomwatch pod(s)
##
extraVolumes: []
## @param extraVolumeMounts Optionally specify extra list of additional volumeMounts for the loomwatch container(s)
##
extraVolumeMounts: []
## @param sidecars Add additional sidecar containers to the loomwatch pod(s)
## A proxy sidecar belongs here rather than in a dedicated chart section: which
## providers are reachable from a given cluster is a property of that network,
## not of loomwatch.
##
sidecars: []
## @param initContainers Add additional init containers to the loomwatch pod(s)
##
initContainers: []

