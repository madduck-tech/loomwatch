  ingressNSPodMatchLabels: {}

## @section Metrics Parameters
##

metrics:
  ## @param metrics.enabled Protect the /metrics endpoint with a bearer token
  ## The endpoint itself is always served; this controls whether a token is
  ## required. Leaving it unprotected exposes which providers you use and how
  ## much of each plan you have burned.
  ##
  enabled: true
  ## Prometheus Operator ServiceMonitor configuration
  ##
  serviceMonitor:
    ## @param metrics.serviceMonitor.enabled Create a ServiceMonitor resource for scraping metrics using Prometheus Operator
    ##
    enabled: false
    ## @param metrics.serviceMonitor.namespace Namespace in which the ServiceMonitor will be created
    ##
    namespace: ""
    ## @param metrics.serviceMonitor.interval Scrape interval. If not set, the Prometheus default scrape interval is used
    ##
    interval: 60s
    ## @param metrics.serviceMonitor.scrapeTimeout Timeout after which the scrape is ended
    ##
    scrapeTimeout: ""
    ## @param metrics.serviceMonitor.labels Additional labels for the ServiceMonitor. Usually needed for the Prometheus Operator to pick it up
    ##
    labels: {}
    ## @param metrics.serviceMonitor.annotations Additional annotations for the ServiceMonitor
    ##
    annotations: {}
    ## @param metrics.serviceMonitor.honorLabels Specify honorLabels parameter to add the scrape endpoint
    ##
    honorLabels: false
    ## @param metrics.serviceMonitor.relabelings Metric relabelings to apply to samples before ingestion
    ##
    relabelings: []
    ## @param metrics.serviceMonitor.metricRelabelings Metrics relabelings to apply to samples before ingestion
    ##
    metricRelabelings: []
    ## @param metrics.serviceMonitor.jobLabel The name of the label on the target service to use as the job name
    ##
    jobLabel: ""
    ## @param metrics.serviceMonitor.selector Prometheus instance selector labels
    ##
    selector: {}
  ## Prometheus Operator PrometheusRule configuration
  ##
  ## These are the rules the chart exists for. Every threshold below is a share
  ## of the plan's own limit, not a guess about what "a lot of tokens" means -
  ## the collector already reports utilisation as a percentage of the limit, so
  ## 100 is the quota itself.
  ##
  prometheusRule:
    ## @param metrics.prometheusRule.enabled Create a PrometheusRule resource for alerting on quota exhaustion
    ##
    enabled: false
    ## @param metrics.prometheusRule.namespace Namespace in which the PrometheusRule will be created
    ##
    namespace: ""
    ## @param metrics.prometheusRule.labels Additional labels for the PrometheusRule
    ##
    labels: {}
    ## @param metrics.prometheusRule.annotations Additional annotations for the PrometheusRule
    ##
    annotations: {}
    ## @param metrics.prometheusRule.providers Regex of providers the default rules observe
    ## Alerting on a provider you have not configured is noise, so this is an
    ## explicit list rather than a catch-all.
    ##
    providers: ".+"
    ## @param metrics.prometheusRule.ignoredQuotaTypes Regex of quota types excluded from the default rules
    ## Anchored on purpose. PromQL label matchers compare the whole string, so
    ## `video` would NOT exclude `weekly_video`; the leading `.*` is what makes
    ## this mean "any video quota, in any window".
    ##
    ignoredQuotaTypes: ".*video"
    ## Ownership of a provider account, published as the recording rule
    ## `loomwatch:account_team` so that alerts and dashboards can be routed and
    ## filtered by the team that pays for the plan.
    ##
    ## The mapping lives in values rather than in the collector's database on
    ## purpose. Account rows exist for three providers only (codex, zai,
    ## minimax); every other provider reports under account_id "default" and has
    ## no row a column could hang on. Values describe all of them, are versioned
    ## in git, and survive a volume that does not persist.
    ##
    ## An account that is not listed here is NOT dropped from the result: it is
    ## published with team "unassigned", which is a value you can alert on. A
    ## forgotten account vanishing from a per-team query is exactly the silent
    ## failure this avoids.
    ##
    ## Configuring this also puts a `team` label on every default alert, so a
    ## page can be routed to whoever owns the plan rather than to a shared
    ## channel. Leave it empty and the alerts keep their previous expressions
    ## exactly: the join is conditional, because joining against a recording
    ## rule that was never created returns an empty vector, and an alert that
    ## silently stops firing is worse than one with no owner.
    ##
    ## Join on BOTH labels - `on (provider, account_id)`. account_id is unique
    ## per provider, not globally: several providers report "default", so
    ## joining on account_id alone aborts the entire query with a many-to-one
    ## error instead of returning partial data.
    ##
    ## teams:
    ##   - provider: zai
    ##     accountId: "1"
    ##     team: platform
    ##   - provider: anthropic
    ##     accountId: "default"
    ##     team: research
    ##
    ## Quote accountId. YAML reads a bare 1000000 as a number and Helm renders
    ## it as 1e+06, which would map an account that does not exist while the
    ## real one stayed unassigned - so the schema requires a string, and on the
    ## command line that means --set-string rather than --set.
    ##
    ## @param metrics.prometheusRule.teams [array] Map provider accounts to the team that owns them
    ##
    teams: []
    ## Providers that report under a provider/account_id pair without being an
    ## account anybody can own. api_integrations is the collector's own
    ## ingestion path, not a subscription, so leaving it in the universe would
    ## fire LoomwatchAccountWithoutTeam forever against a mapping that is in
    ## fact complete - the alert would teach its reader to ignore it, which is
    ## worse than not having it.
    ##
    ## @param metrics.prometheusRule.nonAccountProviders Regex of providers excluded from team ownership
    ##
    nonAccountProviders: "api_integrations"
    ## Base URL the runbook_url annotation on every alert points at. Each alert
    ## appends its own lowercased name as an anchor, so a fork that keeps the
    ## section headings can repoint this at its own copy and every link follows.
    ##
    ## An alert without a runbook is an alert whose reader has to invent the
    ## response at the moment they are least able to - and a quota alert is not
    ## fixed by restarting anything, which is the assumption most on-call
    ## instincts start from.
    ##
    ## @param metrics.prometheusRule.runbookUrlBase Base URL for the runbook_url annotation on each alert
    ##
    runbookUrlBase: "https://github.com/madduck-tech/loomwatch/blob/main/docs/runbooks/README.md"
    ## @param metrics.prometheusRule.highThreshold Utilisation percentage above which LoomwatchQuotaHigh fires
    ##
    highThreshold: 80
    ## @param metrics.prometheusRule.criticalThreshold Utilisation percentage above which LoomwatchQuotaCritical fires
    ##
    criticalThreshold: 95
    ## Burn prediction: will this quota cross 100% before its own window resets?
    ##
    ## Two things here are deliberate and were arrived at the hard way.
    ##
    ## The prediction is written as vector arithmetic (`current + slope *
    ## seconds_remaining`) rather than with `predict_linear`. predict_linear
    ## takes a SCALAR horizon, so it cannot use each series' own reset time -
    ## passing the reset vector to it is a parse error and the rule never
    ## evaluates at all, while still reporting healthy in some UIs.
    ##
    ## The horizon gate matters just as much. Extrapolating a one-day trend
    ## across a week is not evidence, it is noise amplified sixfold - a single
    ## batch job can project a breach that will never happen. Beyond the gate
    ## the rule stays silent rather than guessing. Note that the horizon is a
    ## property of the series, not of its name: a token quota can reset weekly
    ## while a "general" quota resets every five hours.
    ##
    ## The pace is rate() over the quota's rises, not deriv() over its level:
    ## a provider that gives quota back mid-window turns the level into a
    ## sawtooth, and a line fitted through it describes the falls rather than
    ## the consumption.
    ##
    ## @param metrics.prometheusRule.burn.trendWindow Range over which the burn rate of longer windows is measured
    ## @param metrics.prometheusRule.burn.shortTrendWindow Range over which the burn rate of short windows is measured
    ## @param metrics.prometheusRule.burn.shortWindowMaxSeconds Quota windows this long or shorter use shortTrendWindow
    ## @param metrics.prometheusRule.burn.maxHorizonSeconds Do not predict for windows resetting further away than this
    ##
    burn:
      trendWindow: 24h
      shortTrendWindow: 1h
      shortWindowMaxSeconds: 21600
      maxHorizonSeconds: 172800
    ## @param metrics.prometheusRule.defaultRules.quotaHigh Enable the LoomwatchQuotaHigh rule
    ## @param metrics.prometheusRule.defaultRules.quotaCritical Enable the LoomwatchQuotaCritical rule
    ## @param metrics.prometheusRule.defaultRules.burnRate Enable the LoomwatchQuotaBurnsBeforeReset rule
    ## @param metrics.prometheusRule.defaultRules.collectorNotPolling Enable the LoomwatchCollectorNotPolling rule
    ## @param metrics.prometheusRule.defaultRules.collectorStale Enable the LoomwatchCollectorStale rule
    ## @param metrics.prometheusRule.defaultRules.accountWithoutTeam Enable the LoomwatchAccountWithoutTeam rule (only rendered when teams are configured)
    ##
    defaultRules:
      quotaHigh: true
      quotaCritical: true
      burnRate: true
      collectorNotPolling: true
      collectorStale: true
      accountWithoutTeam: true
    ## @param metrics.prometheusRule.extraRules Additional rules appended to the generated group
    ##
    extraRules: []

## Grafana dashboard
##
dashboard:
  ## @param dashboard.enabled Ship the quota dashboard as a ConfigMap for Grafana to import, through a sidecar or through grafana-operator
  ##
  enabled: false
  ## @param dashboard.namespace Namespace in which the dashboard ConfigMap will be created
  ##
  namespace: ""
  ## @param dashboard.labels [object] Labels the Grafana dashboard sidecar selects on
  ##
  labels:
    grafana_dashboard: "1"
  ## @param dashboard.annotations Additional annotations for the dashboard ConfigMap
  ##
  annotations: {}
