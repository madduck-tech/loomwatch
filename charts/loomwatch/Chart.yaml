annotations:
  # Artifact Hub reads the artifacthub.io/* keys and ignores everything else.
  # The bare category/licenses/images keys below them are Bitnami's convention
  # and were doing nothing here; the images one had also been pinned at 1.0.4
  # since that release, which is what Artifact Hub would have security-scanned.
  # The generated tag is checked against appVersion by fork-chart.yml.
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: GPL-3.0-only
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: source
      url: https://github.com/madduck-tech/loomwatch
    - name: chart documentation
      url: https://github.com/madduck-tech/loomwatch/blob/main/charts/loomwatch/README.md
    - name: alert runbooks
      url: https://github.com/madduck-tech/loomwatch/blob/main/docs/runbooks/README.md
    - name: exported metrics
      url: https://github.com/madduck-tech/loomwatch/blob/main/docs/PROMETHEUS_METRICS.md
  artifacthub.io/maintainers: |
    - name: madduck-tech
      email: noreply@madduck-tech.invalid
  artifacthub.io/images: |
    - name: loomwatch
      image: ghcr.io/madduck-tech/loomwatch:1.15.9
apiVersion: v2
appVersion: 1.15.9
description: Prometheus exporter for prepaid LLM subscription quotas - per account, per team, with alerts that name an owner. Exports how much of each plan is left so exhaustion is alerted on days early rather than discovered when a job fails.
home: https://github.com/madduck-tech/loomwatch
icon: https://raw.githubusercontent.com/madduck-tech/loomwatch/main/charts/loomwatch/logo.png
keywords:
  - monitoring
  - observability
  - prometheus
  - grafana
  - llm
  - quota
  - minimax
  - zai
  - finops
  - alerting
maintainers:
  - name: madduck-tech
    url: https://github.com/madduck-tech
name: loomwatch
sources:
  - https://github.com/madduck-tech/loomwatch
type: application
# Kept equal to appVersion on purpose. The chart ships this application from
# the same repository and is released with it, so two independent numbers would
# only raise the question "which chart version carries that fix". The release
# workflow refuses to publish when the two disagree.
version: 1.15.9
