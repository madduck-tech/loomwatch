{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-dashboard" (include "loomwatch.fullname" .) }}
  namespace: {{ default (include "loomwatch.namespace" .) .Values.dashboard.namespace | quote }}
  labels: {{- include "loomwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
    {{- if .Values.dashboard.labels }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.dashboard.labels "context" $) | nindent 4 }}
    {{- end }}
  {{- if or .Values.dashboard.annotations .Values.commonAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
    {{- end }}
    {{- if .Values.dashboard.annotations }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.dashboard.annotations "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
data:
  {{/*
    Not run through the template engine. A dashboard rendered that way breaks
    the moment a panel legend contains {{ }}, which Grafana's own legend syntax
    does constantly.

    But it does need three values from Helm, and shipping it truly verbatim was
    a quiet lie: the colour thresholds are baked into the JSON while the alerts
    take theirs from values. Lower highThreshold to 60 and every rule moves
    while the dashboard keeps colouring at 80, so a quota at 65% pages you and
    shows green. The three replacements below are plain string substitution, not
    templating, so the legend syntax is untouched.

    Grafana applies a threshold step as >=, the rules as >. Exactly on the
    threshold the cell is already coloured and the alert is still silent; the
    gap is one sample wide and not worth a second set of numbers.
  */}}
  {{- $dash := .Files.Get "dashboards/loomwatch.json" }}
  {{- $dash = replace "\"value\": 80" (printf "\"value\": %v" .Values.metrics.prometheusRule.highThreshold) $dash }}
  {{- $dash = replace "\"value\": 95" (printf "\"value\": %v" .Values.metrics.prometheusRule.criticalThreshold) $dash }}
  {{- $dash = replace "\"value\": 300" (printf "\"value\": %v" (mul .Values.pollInterval 5)) $dash }}
  {{- /* The hidden $stale_after constant the forecast queries compare
         collector age with: the same five intervals as the step above. */}}
  {{- $dash = replace "\"query\": \"300\"" (printf "\"query\": \"%v\"" (mul .Values.pollInterval 5)) $dash }}
  loomwatch.json: |
{{ $dash | indent 4 }}
{{- end }}
