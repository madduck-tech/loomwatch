{{- if .Values.metrics.prometheusRule.enabled }}
{{- $sel := printf "provider=~\"%s\",quota_type!~\"%s\"" .Values.metrics.prometheusRule.providers .Values.metrics.prometheusRule.ignoredQuotaTypes }}
{{- $by := "max by (provider, quota_type, account_id)" }}
{{- $rb := .Values.metrics.prometheusRule.runbookUrlBase }}
{{- $remaining := printf "%s (loomwatch_quota_reset_timestamp_seconds{%s} - time())" $by $sel }}
{{- $burn := .Values.metrics.prometheusRule.burn }}
{{- $level := printf "%s (loomwatch_quota_utilization_percent{%s})" $by $sel }}
{{- $short := printf "(%s (loomwatch_quota_window_seconds{%s}) <= %v)" $by $sel $burn.shortWindowMaxSeconds }}
{{/*
  Consumption in percent per second, the same estimator as the dashboard's
  pace(): the rises of the level between steps, summed, divided by the time
  the samples cover.

  Not deriv(): a provider that gives quota back mid-window turns the level into
  a sawtooth, and a line fitted through it describes the falls. Not rate()
  either: rate() reads a fall as a reset to zero and adds the whole level after
  it, so a rolling window drifting from 50 to 49 counted 49 points consumed.
  Divided by covered time rather than the full window, so a young series is
  not diluted to nothing.

  Short windows are measured over shortTrendWindow, because a day's average
  dilutes the working hours with the night; longer ones over trendWindow.
*/}}
{{- $shortRise := printf "clamp_min(%s - %s (loomwatch_quota_utilization_percent{%s} offset 2m), 0)" $level $by $sel }}
{{- $longRise := printf "clamp_min(%s - %s (loomwatch_quota_utilization_percent{%s} offset 5m), 0)" $level $by $sel }}
{{- $shortPace := printf "(sum_over_time((%s)[%s:2m]) / (count_over_time((%s)[%s:2m]) * 120))" $shortRise $burn.shortTrendWindow $shortRise $burn.shortTrendWindow }}
{{- $longPace := printf "(sum_over_time((%s)[%s:5m]) / (count_over_time((%s)[%s:5m]) * 300))" $longRise $burn.trendWindow $longRise $burn.trendWindow }}
{{- $rate := printf "((%s and on (provider, quota_type, account_id) %s) or (%s unless on (provider, quota_type, account_id) %s))" $shortPace $short $longPace $short }}
{{/*
  The team join, or nothing at all when no team is configured.

  It has to be conditional. loomwatch:account_team only exists when
  metrics.prometheusRule.teams is set, and multiplying by a series that does not
  exist yields an empty vector - so an unconditional join would silently stop
  every alert here from ever firing, for everyone who does not use teams. Empty
  is the one failure a threshold rule cannot report.

  group_left is safe in the other direction too: loomwatch:account_team covers
  every account that reports, "unassigned" included, so the join cannot drop a
  row that the alert would otherwise have fired on.
*/}}
{{- $team := "" }}
{{- if .Values.metrics.prometheusRule.teams }}
{{- $team = " * on (provider, account_id) group_left(team) loomwatch:account_team" }}
{{- end }}
{{/*
  Nothing is rendered when every rule is switched off. A PrometheusRule whose
  only group carries `rules: null` is accepted by the CRD and loaded by
  Prometheus, so it fails at neither - it just sits there looking like coverage.
*/}}
{{- $quotaRules := or .Values.metrics.prometheusRule.defaultRules.quotaHigh .Values.metrics.prometheusRule.defaultRules.quotaCritical .Values.metrics.prometheusRule.defaultRules.burnRate .Values.metrics.prometheusRule.defaultRules.collectorNotPolling .Values.metrics.prometheusRule.defaultRules.collectorStale .Values.metrics.prometheusRule.extraRules }}
{{- if or .Values.metrics.prometheusRule.teams $quotaRules }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "loomwatch.fullname" . }}
  namespace: {{ default (include "loomwatch.namespace" .) .Values.metrics.prometheusRule.namespace | quote }}
  labels: {{- include "loomwatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    {{- if .Values.metrics.prometheusRule.labels }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.metrics.prometheusRule.labels "context" $) | nindent 4 }}
    {{- end }}
  {{- if or .Values.metrics.prometheusRule.annotations .Values.commonAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
    {{- end }}
    {{- if .Values.metrics.prometheusRule.annotations }}
    {{- include "loomwatch.tplvalues.render" (dict "value" .Values.metrics.prometheusRule.annotations "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  groups:
    {{- if .Values.metrics.prometheusRule.teams }}
    # Account ownership. Published as a recording rule rather than stored in the
    # collector, because account rows exist for three providers only and every
    # other provider reports under account_id "default" - there is no row for a
    # column to live on. See values.yaml for the full reasoning.
    - name: loomwatch.teams
      rules:
        {{- $seen := dict }}
        {{- range $t := .Values.metrics.prometheusRule.teams }}
        {{- $pair := printf "%s/%s" $t.provider $t.accountId }}
        {{- if hasKey $seen $pair }}
        {{- fail (printf "metrics.prometheusRule.teams: %s is listed twice. A provider/accountId pair owns exactly one team; two of them publish two series for one match group, and every consumer join then fails with a many-to-one error - including for accounts that have nothing to do with this one." $pair) }}
        {{- end }}
        {{- $_ := set $seen $pair true }}
        {{- end }}
        # One rule, not one per entry: two rules recording the same series name
        # are a duplicate as far as promtool's linter is concerned, since it
        # cannot see that label_replace gives them different labels.
        - record: loomwatch:account_team_map
          expr: >-
            {{- range $i, $t := .Values.metrics.prometheusRule.teams }}
            {{ if $i }}or{{ end }}
            label_replace(label_replace(label_replace(vector(1), "provider", "{{ $t.provider }}", "", ""), "account_id", "{{ $t.accountId }}", "", ""), "team", "{{ $t.team }}", "", "")
            {{- end }}
        # Every account that reports at all gets a team, so a join against this
        # series can never drop one. An account missing from the map above is
        # published as "unassigned" - visible and alertable - instead of
        # silently disappearing from every per-team query.
        #
        # loomwatch_agent_healthy is the universe on purpose: it carries exactly
        # {provider, account_id} and every account that reports a quota also
        # reports it, including balance-based providers with no utilisation
        # series. It is the universe of accounts that REPORT, not of accounts
        # that exist: a provider with no metrics export at all, or an account
        # whose very first poll never succeeded, is absent from both.
        - record: loomwatch:account_team
          expr: >-
            loomwatch:account_team_map
            or
            label_replace(
              loomwatch_agent_healthy{provider!~"{{ .Values.metrics.prometheusRule.nonAccountProviders }}"} * 0 + 1
              unless on (provider, account_id) loomwatch:account_team_map,
              "team", "unassigned", "", ""
            )
        {{- if .Values.metrics.prometheusRule.defaultRules.accountWithoutTeam }}
        # The inverse control. Without it this feature is a regression: an
        # account nobody assigned would be absent from team dashboards and
        # nothing would say so.
        - alert: LoomwatchAccountWithoutTeam
          expr: loomwatch:account_team{team="unassigned"}
          for: 1h
          labels:
            severity: warning
            subsystem: llm-quota
          annotations:
            runbook_url: {{ printf "%s#%s" $rb "loomwatchaccountwithoutteam" }}
            summary: >-
              Account {{ "{{ $labels.account_id }}" }} on {{ "{{ $labels.provider }}" }} has no owning team
            description: >-
              This account burns quota that no team dashboard shows and no
              team-routed alert covers. Add it to metrics.prometheusRule.teams,
              or record deliberately that it is shared.
        {{- end }}
    {{- end }}
    {{- if $quotaRules }}
    - name: loomwatch.quotas
      rules:
        {{- if .Values.metrics.prometheusRule.defaultRules.quotaHigh }}
        # Utilisation is already expressed as a share of the plan's own limit,
        # so the threshold is a share of the quota rather than a guess about
        # what counts as "a lot of tokens". 100 is the quota itself.
        - alert: LoomwatchQuotaHigh
          expr: >-
            ({{ $by }} (loomwatch_quota_utilization_percent{ {{- $sel -}} }) > {{ .Values.metrics.prometheusRule.highThreshold }}){{ $team }}
          for: 10m
          labels:
            severity: warning
            subsystem: llm-quota
          annotations:
            runbook_url: {{ printf "%s#%s" $rb "loomwatchquotahigh" }}
            summary: >-
              Quota {{ "{{ $labels.quota_type }}" }} of {{ "{{ $labels.provider }}" }} (account {{ "{{ $labels.account_id }}" }}) is over {{ .Values.metrics.prometheusRule.highThreshold }}% used
            description: >-
              There may not be enough left before the window resets. Check what
              is consuming it and consider pausing background workloads.
        {{- end }}
        {{- if .Values.metrics.prometheusRule.defaultRules.quotaCritical }}
        - alert: LoomwatchQuotaCritical
          expr: >-
            ({{ $by }} (loomwatch_quota_utilization_percent{ {{- $sel -}} }) > {{ .Values.metrics.prometheusRule.criticalThreshold }}){{ $team }}
          for: 5m
          labels:
            severity: critical
            subsystem: llm-quota
          annotations:
            runbook_url: {{ printf "%s#%s" $rb "loomwatchquotacritical" }}
            summary: >-
              Quota {{ "{{ $labels.quota_type }}" }} of {{ "{{ $labels.provider }}" }} (account {{ "{{ $labels.account_id }}" }}) is over {{ .Values.metrics.prometheusRule.criticalThreshold }}% used
            description: >-
              The provider will start refusing requests shortly and anything
              depending on it will fail. Stop optional workloads or raise the plan.
        {{- end }}
        {{- if .Values.metrics.prometheusRule.defaultRules.burnRate }}
        # `current + slope * seconds_remaining`, written out rather than using
        # predict_linear: that function takes a scalar horizon and therefore
        # cannot use each series' own reset time. Feeding it the reset vector is
        # a parse error, and a rule that never evaluates is worse than no rule -
        # it looks like coverage.
        #
        # The second clause is the horizon gate. Extrapolating the trend window
        # across a much longer horizon is noise amplification, not evidence.
        - alert: LoomwatchQuotaBurnsBeforeReset
          expr: >-
            (
            (
            (
            {{ $by }} (loomwatch_quota_utilization_percent{ {{- $sel -}} })
            + {{ $rate }}
            * {{ $remaining }}
            ) > 100
            )
            and
            {{ $remaining }} < {{ .Values.metrics.prometheusRule.burn.maxHorizonSeconds }}
            ){{ $team }}
          for: 30m
          labels:
            severity: warning
            subsystem: llm-quota
          annotations:
            runbook_url: {{ printf "%s#%s" $rb "loomwatchquotaburnsbeforereset" }}
            summary: >-
              Quota {{ "{{ $labels.quota_type }}" }} of {{ "{{ $labels.provider }}" }} (account {{ "{{ $labels.account_id }}" }}) is on track to run out before it resets
            description: >-
              This is high consumption in the only measurable sense: not an
              absolute number of tokens, but the rate relative to the plan's own
              quota, projected to the moment that quota resets.
        {{- end }}
        {{- if .Values.metrics.prometheusRule.defaultRules.collectorNotPolling }}
        # Threshold derived from pollInterval rather than hand-picked, so it
        # moves when the interval does instead of silently going stale.
        #
        # Grouped by account and not only by provider. One key of a provider can
        # expire while its other keys keep polling, and `max by (provider)` hides
        # exactly that: the healthy accounts hold the maximum down and the dead
        # one is invisible. It is also what makes the account addressable - the
        # team join below needs account_id, and an alert nobody owns is the
        # problem this is here to solve.
        - alert: LoomwatchCollectorNotPolling
          expr: >-
            (max by (provider, account_id) (loomwatch_agent_last_cycle_age_seconds{provider=~"{{ .Values.metrics.prometheusRule.providers }}"}) > {{ mul .Values.pollInterval 5 }}){{ $team }}
          for: 10m
          labels:
            severity: warning
            subsystem: llm-quota
          annotations:
            runbook_url: {{ printf "%s#%s" $rb "loomwatchcollectornotpolling" }}
            summary: >-
              Quota collector stopped polling {{ "{{ $labels.provider }}" }}
              (account {{ "{{ $labels.account_id }}" }})
            description: >-
              Distinct from LoomwatchCollectorStale: this catches the collector
              itself stalling, where its own health flag stays at 1 and reports
              nothing. Check the loomwatch container logs.
        {{- end }}
        {{- if .Values.metrics.prometheusRule.defaultRules.collectorStale }}
        # Startup is suppressed by `for`, not by a condition on process start
        # time. Such a condition yields an EMPTY result when unmet, and an empty
        # result is indistinguishable from a healthy one - the guard against
        # false alarms would become their source.
        - alert: LoomwatchCollectorStale
          expr: >-
            (min by (provider, account_id) (loomwatch_agent_healthy{provider=~"{{ .Values.metrics.prometheusRule.providers }}"}) < 1){{ $team }}
          for: 15m
          labels:
            severity: warning
            subsystem: llm-quota
          annotations:
            runbook_url: {{ printf "%s#%s" $rb "loomwatchcollectorstale" }}
            summary: >-
              Quota collector is not receiving data from
              {{ "{{ $labels.provider }}" }} (account {{ "{{ $labels.account_id }}" }})
            description: >-
              Remaining quota stopped updating, which means every other quota
              rule here is blind and its silence no longer means anything. The
              usual cause is an expired provider key or an unreachable API.
        {{- end }}
        {{- if .Values.metrics.prometheusRule.extraRules }}
        {{- include "loomwatch.tplvalues.render" (dict "value" .Values.metrics.prometheusRule.extraRules "context" $) | nindent 8 }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
